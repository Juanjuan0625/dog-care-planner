<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Care Planner</title>
    <style>
        :root {
          --blank-bg: #f4f7fa;
          --blank-surface: #ffffff;
          --blank-text: #1d2430;
          --blank-muted: #6b7a8c;
          --blank-border: #d8dee8;
          --blank-primary: #176b87;
          --blank-primary-dark: #0e4254;
          --blank-focus-ring: rgba(23, 107, 135, 0.2);
          --blank-control-bg: #ffffff;
          --blank-control-bg-hover: #f0f4f8;
          --blank-control-disabled: #e8ecf1;
          --blank-surface-muted: #eef3f7;
          --anvil-banner-height: 0px;
        }
        * { box-sizing: border-box; }
        body {
          min-height: 100vh;
          min-height: calc(100vh - var(--anvil-banner-height, 0px));
          margin: 0;
          background: var(--blank-bg);
          color: var(--blank-text);
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          font-size: 16px;
          line-height: 1.5;
        }
        .page-shell {
          min-height: 100vh;
          min-height: calc(100vh - var(--anvil-banner-height, 0px));
        }
        .page-header {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 32px;
          padding: 30px clamp(20px, 5vw, 72px);
          background: linear-gradient(118deg, var(--blank-primary-dark), var(--blank-primary));
          box-shadow: 0 8px 24px rgba(14, 66, 84, 0.14);
        }
        .page-actions {
          display: flex;
          flex-wrap: wrap;
          justify-content: flex-end;
          gap: 10px;
        }
        .page-main {
          width: min(1160px, calc(100% - 40px));
          margin: 0 auto;
          padding: 44px 0 72px;
        }
        a { color: var(--blank-primary); text-decoration: none; }
        a:hover { color: var(--blank-primary-dark); }
        .page-header a {
          display: inline-flex;
          align-items: center;
          min-height: 36px;
          padding: 0 14px;
          border-radius: 6px;
          color: rgba(255,255,255,0.85);
          font-weight: 600;
        }
        .page-header a:hover,
        .page-header a.is-active {
          background: rgba(255,255,255,0.15);
          color: #fff;
        }
        .anvil-role-eyebrow {
          margin: 0 0 4px;
          color: rgba(255,255,255,0.78);
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        }
        .anvil-role-h1 {
          margin: 0;
          color: white;
          font-size: clamp(28px, 3vw, 38px);
          line-height: 1.15;
          font-weight: 750;
          letter-spacing: -0.035em;
        }
        .anvil-role-lede {
          max-width: 720px;
          margin: 6px 0 24px;
          color: var(--blank-text);
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .anvil-button > button,
        .anvil-button > a {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 42px;
          padding: 0 18px;
          border: 1px solid transparent;
          border-radius: 9px;
          font-weight: 700;
          font-size: 14px;
          background: var(--blank-primary);
          color: white;
          cursor: pointer;
          box-shadow: 0 3px 8px rgba(14, 66, 84, 0.12);
          transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
        }
        .anvil-button > button:hover,
        .anvil-button > a:hover {
          background: var(--blank-primary-dark);
          transform: translateY(-1px);
          box-shadow: 0 6px 14px rgba(14, 66, 84, 0.18);
        }
        .anvil-button.secondary > button,
        .anvil-button.secondary > a {
          border-color: var(--blank-border);
          background: var(--blank-surface);
          color: var(--blank-primary-dark);
          box-shadow: none;
        }
        .anvil-button.danger > button {
          background: #c0392b;
        }
        .anvil-button.danger > button:hover {
          background: #96281b;
        }
        .anvil-role-summary-card,
        .anvil-role-section-card {
          margin-top: 22px;
          padding: 26px;
          border: 1px solid var(--blank-border);
          border-radius: 14px;
          background: var(--blank-surface);
          box-shadow: 0 8px 24px rgba(29, 36, 48, 0.045);
        }
        .anvil-role-summary-card {
          position: relative;
          overflow: hidden;
          border-color: rgba(23, 107, 135, 0.22);
          border-left: 5px solid var(--blank-primary);
          background: linear-gradient(110deg, var(--blank-surface), var(--blank-surface-muted));
        }
        .anvil-role-section-heading {
          margin: 0 0 12px;
          color: var(--blank-text);
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .anvil-role-summary-caption {
          color: var(--blank-muted);
          font-size: 14px;
        }
        .anvil-role-summary-value {
          color: var(--blank-primary-dark);
          font-size: 28px;
          font-weight: 700;
          letter-spacing: -0.035em;
        }
        .stats-row {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          gap: 14px;
          margin: 16px 0;
        }
        .stat-box {
          background: var(--blank-surface-muted);
          border-radius: 10px;
          padding: 16px;
          text-align: center;
        }
        .stat-box .num { font-size: 26px; font-weight: 700; color: var(--blank-primary-dark); }
        .stat-box .lbl { font-size: 13px; color: var(--blank-muted); margin-top: 2px; }
        .anvil-role-task-list, .anvil-role-dog-list {
          display: grid;
          gap: 12px;
          margin-top: 14px;
        }
        .anvil-role-task-card, .anvil-role-dog-card {
          padding: 18px 20px;
          border: 1px solid rgba(216, 222, 232, 0.85);
          border-radius: 12px;
          background: var(--blank-surface);
          box-shadow: 0 3px 10px rgba(29, 36, 48, 0.035);
          transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
        }
        .anvil-role-task-card:hover, .anvil-role-dog-card:hover {
          border-color: rgba(23, 107, 135, 0.4);
          box-shadow: 0 8px 20px rgba(29, 36, 48, 0.08);
        }
        .anvil-role-task-time {
          display: inline-block;
          padding: 4px 10px;
          border-radius: 999px;
          background: var(--blank-surface-muted);
          color: var(--blank-primary-dark);
          font-size: 13px;
          font-weight: 700;
        }
        .anvil-role-task-description {
          color: var(--blank-text);
          font-size: 17px;
          font-weight: 700;
          margin-left: 8px;
        }
        .anvil-role-muted { color: var(--blank-muted); font-size: 14px; }
        .pill {
          display: inline-block;
          padding: 3px 10px;
          border-radius: 999px;
          font-size: 12px;
          font-weight: 700;
        }
        .pill.feeding { background: #fde2c8; color: #a05a1e; }
        .pill.walking { background: #d8e8d0; color: #3f6b2a; }
        .pill.medication { background: #f8d4d4; color: #a03a3a; }
        .pill.other { background: #e0d8e8; color: #5a3a70; }
        .pill.done { background: #edf6f0; color: #286646; }
        .pill.open { background: #f4f2e9; color: #77632b; }
        .thumb {
          width: 48px; height: 48px; object-fit: cover;
          border-radius: 8px; vertical-align: middle;
        }
        .dog-avatar {
          width: 64px; height: 64px; border-radius: 50%;
          object-fit: cover; background: var(--blank-surface-muted);
        }
        .dog-avatar-big {
          width: 110px; height: 110px; border-radius: 50%;
          object-fit: cover; background: var(--blank-surface-muted);
        }
        .dog-placeholder {
          width: 64px; height: 64px; border-radius: 50%;
          background: var(--blank-surface-muted);
          display: flex; align-items: center; justify-content: center;
          font-size: 28px;
        }
        .dog-placeholder-big {
          width: 110px; height: 110px; border-radius: 50%;
          background: var(--blank-surface-muted);
          display: flex; align-items: center; justify-content: center;
          font-size: 48px;
        }
        form label {
          display: block;
          margin: 14px 0 4px;
          font-weight: 600;
          font-size: 14px;
          color: var(--blank-text);
        }
        form input[type="text"], form input[type="date"], form input[type="file"] {
          width: 100%;
          min-height: 42px;
          padding: 9px 12px;
          border: 1px solid var(--blank-border);
          border-radius: 8px;
          font-size: 14px;
          background: var(--blank-control-bg);
          color: var(--blank-text);
        }
        form input:focus {
          outline: none;
          border-color: var(--blank-primary);
          box-shadow: 0 0 0 3px var(--blank-focus-ring);
        }
        .form-actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .flash {
          padding: 12px 16px;
          border-radius: 8px;
          margin-bottom: 16px;
          font-size: 14px;
        }
        .flash-success { background: #e0f0d8; color: #2f5a1e; }
        .flash-error { background: #f8d4d4; color: #a03a3a; }
        .error-box {
          border-left: 4px solid #c0392b;
          background: #fdf0ef;
          padding: 14px 18px;
          border-radius: 8px;
          margin-bottom: 16px;
        }
        .error-box ul { margin: 6px 0 0 18px; color: #a03a3a; }
        .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .space-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .checkin-form { display: inline-flex; gap: 6px; align-items: center; }
        .checkin-form input[type="file"] { font-size: 12px; padding: 4px; min-height: auto; }
        .week-chart {
          display: flex; gap: 8px; margin-top: 14px; align-items: flex-end; height: 110px;
        }
        .week-col { flex: 1; text-align: center; }
        .week-bar {
          background: var(--blank-primary);
          border-radius: 4px 4px 0 0;
          min-height: 4px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--blank-border); vertical-align: middle; }
        th { color: var(--blank-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        @media (max-width: 760px) {
          .page-header { padding: 24px 20px; flex-direction: column; align-items: flex-start; }
          .page-actions { justify-content: flex-start; }
          .page-main { padding: 28px 0 48px; }
        }
        /* pretty file upload */
        .file-upload { display: flex; align-items: center; gap: 10px; }
        .file-upload input[type="file"] { display: none; }
        .file-upload-label {
          display: inline-flex; align-items: center; gap: 6px;
          padding: 9px 16px;
          border: 1px solid var(--blank-border);
          border-radius: 8px;
          background: var(--blank-surface-muted);
          color: var(--blank-primary-dark);
          font-size: 13px; font-weight: 600;
          cursor: pointer;
          transition: background 140ms ease;
        }
        .file-upload-label:hover { background: #dfe7ee; }
        /* task category icon bubble */
        .task-icon {
          width: 44px; height: 44px; border-radius: 50%;
          background: var(--blank-surface-muted);
          display: flex; align-items: center; justify-content: center;
          font-size: 20px; flex-shrink: 0;
        }
        /* calendar grid */
        .cal-grid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 6px;
          margin-top: 16px;
        }
        .cal-head {
          text-align: center;
          font-size: 12px; font-weight: 700;
          color: var(--blank-muted);
          padding: 6px 0;
          text-transform: uppercase;
        }
        .cal-cell {
          min-height: 80px;
          border: 1px solid var(--blank-border);
          border-radius: 8px;
          padding: 8px;
          font-size: 13px;
          background: var(--blank-surface);
          text-decoration: none;
          color: var(--blank-text);
          display: flex;
          flex-direction: column;
        }
        .cal-cell:hover { border-color: var(--blank-primary); }
        .cal-cell.other-month { opacity: 0.35; }
        .cal-cell.today { border: 2px solid var(--blank-primary); }
        .cal-cell.selected { background: var(--blank-primary); color: white; }
        .cal-cell.selected .cal-count, .cal-cell.selected .cal-day { color: white; }
        .cal-day { font-weight: 700; margin-bottom: 4px; }
        .cal-bar {
          height: 6px; border-radius: 3px;
          background: var(--blank-surface-muted);
          margin-top: auto;
          overflow: hidden;
        }
        .cal-bar-fill { height: 100%; background: var(--blank-primary); }
        .cal-count { font-size: 11px; color: var(--blank-muted); margin-top: 2px; }
    </style>
</head>
<body>
<div class="page-shell">
    <header class="page-header">
        <div>
            <h1 class="anvil-role-h1">Dog Care Planner</h1>
        </div>
        <nav class="page-actions">
            {% set ep = request.endpoint %}
            <a href="{{ url_for('dashboard') }}" class="{{ 'is-active' if ep == 'dashboard' else '' }}">Dashboard</a>
            <a href="{{ url_for('dogs_page') }}" class="{{ 'is-active' if ep in ['dogs_page','dog_detail','edit_dog','add_dog'] else '' }}">Dogs</a>
            <a href="{{ url_for('tasks_today') }}" class="{{ 'is-active' if ep == 'tasks_today' else '' }}">Tasks</a>
            <a href="{{ url_for('history') }}" class="{{ 'is-active' if ep in ['history','calendar'] else '' }}">History</a>
            <a href="{{ url_for('summary') }}" class="{{ 'is-active' if ep == 'summary' else '' }}">Summary</a>
        </nav>
    </header>
    <main class="page-main">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
            <div class="flash flash-{{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
